      - name: Download arm64 publish
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-win-arm64
          path: artifacts/msix/layout/win-arm64

      - name: Build unsigned MSIX packages
        shell: pwsh
        run: >
          ./src/Devolutions.Terminal.Package/Scripts/Build-Packages.ps1
          -SkipPublish
          -OutputDirectory ./artifacts/msix
          -Version "${{ needs.release-metadata.outputs.msix_version }}"

      - name: Validate package structure
        shell: pwsh
        run: >
          ./src/Devolutions.Terminal.Package/Scripts/Test-Packages.ps1
          -PackagePath (Get-ChildItem ./artifacts/msix/packages -File |
          Where-Object Extension -eq ".msix" |
          ForEach-Object FullName)

      - name: Upload unsigned MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevolutionsTerminal-MSIX-unsigned
          path: artifacts/msix/packages
          if-no-files-found: error

  nuget:
    name: NuGet distribution package
    needs:
      - native-aot
      - linux-packages
      - macos-native-aot
      - release-metadata
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Windows x64 publish
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-win-x64
          path: artifacts/nuget/layout/win-x64

      - name: Download Windows arm64 publish
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-win-arm64
          path: artifacts/nuget/layout/win-arm64

      - name: Download Linux x64 publish
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-linux-x64
          path: artifacts/nuget/layout/linux-x64

      - name: Download Linux arm64 publish
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-linux-arm64
          path: artifacts/nuget/layout/linux-arm64

      - name: Download macOS x64 publish
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-osx-x64
          path: artifacts/nuget/layout/osx-x64

      - name: Download macOS arm64 publish
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-osx-arm64
          path: artifacts/nuget/layout/osx-arm64

      - name: Build NuGet distribution packages
        shell: pwsh
        run: >
          ./src/Devolutions.Terminal.Package/Scripts/Build-NuGet.ps1
          -SkipPublish
