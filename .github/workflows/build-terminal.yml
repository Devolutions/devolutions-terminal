name: Build Terminal

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - ".github/workflows/build-ghostty.yml"
  pull_request:
    paths-ignore:
      - ".github/workflows/build-ghostty.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to build/publish (for example 2026.3.0).
        required: true
        type: string
      tag:
        description: Release tag to create or update when publishing (vMAJOR.MINOR.PATCH).
        required: false
        type: string
      dry_run:
        description: Build and package; upload release assets without publishing.
        required: false
        default: false
        type: boolean
      sign_dry_run:
        description: Sign Windows packages during a dry run when signing credentials are available.
        required: false
        default: false
        type: boolean
      github-env:
        description: GitHub Environment for code-signing secrets.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - test
          - prod

permissions:
  contents: read

concurrency:
  group: build-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      msix_version: ${{ steps.resolve.outputs.msix_version }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      sign_dry_run: ${{ steps.resolve.outputs.sign_dry_run }}
      publish_environment: ${{ steps.resolve.outputs.publish_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve tag, versions, and signing environment
        id: resolve
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          SIGN_DRY_RUN: ${{ inputs.sign_dry_run }}
          REQUESTED_ENVIRONMENT: ${{ inputs['github-env'] }}
        run: |
          $dryRun = if ([string]::IsNullOrWhiteSpace($env:DRY_RUN)) { "false" } else { $env:DRY_RUN.ToLowerInvariant() }
          if ($dryRun -notin @("true", "false")) {
            throw "dry_run must be true or false."
          }

          $signDryRun = if ([string]::IsNullOrWhiteSpace($env:SIGN_DRY_RUN)) { "false" } else { $env:SIGN_DRY_RUN.ToLowerInvariant() }
          if ($signDryRun -notin @("true", "false")) {
            throw "sign_dry_run must be true or false."
          }

          if ($dryRun -eq "true" -and $signDryRun -ne "true") {
            $publishEnvironment = "publish-dry-run"
          }
          else {
            $requestedEnvironment = if ([string]::IsNullOrWhiteSpace($env:REQUESTED_ENVIRONMENT)) { "auto" } else { $env:REQUESTED_ENVIRONMENT.ToLowerInvariant() }
            $publishEnvironment = switch ($requestedEnvironment) {
              "auto" { if ($env:GITHUB_REF_TYPE -eq "tag" -or $env:GITHUB_REF_NAME -eq "master") { "publish-prod" } else { "publish-test" } }
              "test" { "publish-test" }
              "prod" { "publish-prod" }
              default { throw "Unsupported github-env value: $requestedEnvironment. Expected auto, test, or prod." }
            }
          }

          $requestedVersion = if ($null -eq $env:REQUESTED_VERSION) { "" } else { $env:REQUESTED_VERSION.TrimStart("v") }
          $tag = $env:REQUESTED_TAG
          if (-not [string]::IsNullOrWhiteSpace($requestedVersion)) {
            if ($requestedVersion -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
              throw "Release version must use YYYY.MAJOR.PATCH; received '$($env:REQUESTED_VERSION)'."
            }
            $releaseVersion = $requestedVersion
            $expectedTag = "v$releaseVersion"
            if (-not [string]::IsNullOrWhiteSpace($tag) -and $tag -ne $expectedTag) {
              throw "Version '$releaseVersion' does not match tag '$tag'."
            }
            $tag = $expectedTag
          }
          elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              throw "Release tag must be vYYYY.MAJOR.PATCH; received '$tag'."
            }
            $releaseVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          }
          else {
            [xml]$props = Get-Content -LiteralPath "Directory.Build.props"
            $releaseVersion = $props.Project.PropertyGroup.VersionPrefix
            if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "Directory.Build.props must contain a three-component numeric VersionPrefix."
            }
            $tag = "v$releaseVersion.$env:GITHUB_RUN_NUMBER"
          }

          $msixVersion = "$releaseVersion.0"
          @(
            "release_tag=$tag"
            "release_version=$releaseVersion"
            "msix_version=$msixVersion"
            "dry_run=$dryRun"
            "sign_dry_run=$signDryRun"
            "publish_environment=$publishEnvironment"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build:
    name: Build and test
    runs-on: windows-latest
    needs: release-metadata
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            artifacts/tools
            artifacts/ghostty-src
            native/ghostty/*/*
            native/linux-pty/*/dt-pty-host
            native/noto-emoji/NotoColorEmoji.ttf
          # Never restore native sources or reuse binaries built from different inputs.
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/*.ps1', 'native/ghostty/ghostty-upstream.json', 'native/linux-pty/dt-pty-host.c', 'native/noto-emoji/noto-emoji.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Devolutions.Terminal.slnx -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Build
        run: dotnet build Devolutions.Terminal.slnx -c Release --no-restore -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Test
        run: dotnet test Devolutions.Terminal.slnx -c Release --no-build -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

  native-aot:
    name: NativeAOT ${{ matrix.rid }}
    runs-on: windows-latest
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            artifacts/tools
            artifacts/ghostty-src
            native/ghostty/*/*
            native/linux-pty/*/dt-pty-host
            native/noto-emoji/NotoColorEmoji.ttf
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rid }}-${{ hashFiles('native/**/*.ps1', 'native/ghostty/ghostty-upstream.json', 'native/linux-pty/dt-pty-host.c', 'native/noto-emoji/noto-emoji.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Devolutions.Terminal/Devolutions.Terminal.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}
          -o artifacts/${{ matrix.rid }}

      - name: Upload native executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DevolutionsTerminal-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error

  linux-managed:
    name: Linux managed and metadata tests
    runs-on: ubuntu-24.04
    needs: release-metadata
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            artifacts/tools
            artifacts/ghostty-src
            native/ghostty/*/*
            native/linux-pty/*/dt-pty-host
            native/noto-emoji/NotoColorEmoji.ttf
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/*.ps1', 'native/ghostty/ghostty-upstream.json', 'native/linux-pty/dt-pty-host.c', 'native/noto-emoji/noto-emoji.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Devolutions.Terminal.slnx -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Run managed tests
        run: dotnet test Devolutions.Terminal.slnx -c Release --no-restore -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Validate Linux scripts and metadata
        run: bash scripts/Test-LinuxPackagingMetadata.sh

  macos-managed:
    name: macOS managed and metadata tests
    runs-on: macos-14
    needs: release-metadata
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            artifacts/tools
            artifacts/ghostty-src
            native/ghostty/*/*
            native/linux-pty/*/dt-pty-host
            native/noto-emoji/NotoColorEmoji.ttf
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/*.ps1', 'native/ghostty/ghostty-upstream.json', 'native/linux-pty/dt-pty-host.c', 'native/noto-emoji/noto-emoji.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Devolutions.Terminal.slnx -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Run managed tests
        run: dotnet test Devolutions.Terminal.slnx -c Release --no-restore -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Validate macOS scripts and metadata
        run: bash scripts/Test-MacOsPackagingMetadata.sh

  macos-native-aot:
    name: macOS NativeAOT osx-arm64
    runs-on: macos-14
    needs:
      - macos-managed
      - release-metadata
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            artifacts/tools
            artifacts/ghostty-src
            native/ghostty/*/*
            native/linux-pty/*/dt-pty-host
            native/noto-emoji/NotoColorEmoji.ttf
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/*.ps1', 'native/ghostty/ghostty-upstream.json', 'native/linux-pty/dt-pty-host.c', 'native/noto-emoji/noto-emoji.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: NativeAOT publish
        run: >
          dotnet publish src/Devolutions.Terminal/Devolutions.Terminal.csproj
          -c Release
          -r osx-arm64
          --self-contained true
          -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}
          -p:DebugSymbols=false
          -p:DebugType=None
          -p:NativeDebugSymbols=false
          -o artifacts/publish/osx-arm64

      - name: Build app bundle and zip
        env:
          MACOS_PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/osx-arm64
          SOURCE_DATE_EPOCH: "1704067200"
        run: >
          bash scripts/Build-MacOsPackage.sh osx-arm64
          "${{ needs.release-metadata.outputs.release_version }}"
          artifacts/macos-packages

      - name: Validate package without launching UI
        run: bash scripts/Test-MacOsPackage.sh osx-arm64 artifacts/macos-packages/*.zip

      - name: Run native non-UI gates
        run: bash scripts/Test-MacOsRuntime.sh artifacts/macos-packages

      - name: Upload macOS package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DevolutionsTerminal-osx-arm64-packages
          path: artifacts/macos-packages
          if-no-files-found: error

  linux-packages:
    name: Linux packages ${{ matrix.rid }}
    runs-on: ubuntu-24.04
    needs:
      - linux-managed
      - release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            appimage_arch: x86_64
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - rid: linux-arm64
            appimage_arch: aarch64
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream desktop-file-utils rpm squashfs-tools

      - name: Install ARM64 cross toolchain
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get install --no-install-recommends \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Fetch pinned AppImage runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/tools | Out-Null
          gh release download 20251108 --repo AppImage/type2-runtime `
            --pattern "runtime-${{ matrix.appimage_arch }}" `
            --dir artifacts/tools
          $runtime = "artifacts/tools/runtime-${{ matrix.appimage_arch }}"
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $runtime).Hash.ToLowerInvariant()
          if ($actualHash -ne "${{ matrix.runtime_sha256 }}") {
            throw "Runtime hash mismatch: expected ${{ matrix.runtime_sha256 }}, got $actualHash."
          }

      - name: NativeAOT publish
        shell: pwsh
        run: |
          $publishArgs = @(
            "src/Devolutions.Terminal/Devolutions.Terminal.csproj",
            "-c", "Release",
            "-r", "${{ matrix.rid }}",
            "--self-contained", "true",
            "-p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}",
            "-p:DebugSymbols=false",
            "-p:DebugType=None",
            "-p:NativeDebugSymbols=false",
            "-o", "artifacts/publish/${{ matrix.rid }}"
          )
          if ("${{ matrix.rid }}" -eq "linux-arm64") {
            $publishArgs += "-p:ObjCopyName=aarch64-linux-gnu-objcopy"
          }
          dotnet publish @publishArgs

      - name: Build deterministic tar, DEB, RPM, and AppImage
        env:
          APPIMAGE_RUNTIME_FILE: ${{ github.workspace }}/artifacts/tools/runtime-${{ matrix.appimage_arch }}
          LINUX_PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}
          SOURCE_DATE_EPOCH: "1704067200"
        run: |
          bash scripts/Build-LinuxPackage.sh \
            "${{ matrix.rid }}" "${{ needs.release-metadata.outputs.release_version }}" \
            artifacts/linux-packages all

      - name: Validate packages without launching UI
        run: |
          bash scripts/Test-LinuxPackage.sh "${{ matrix.rid }}" \
            artifacts/linux-packages/*-"${{ matrix.rid }}".tar.gz \
            artifacts/linux-packages/*-"${{ matrix.rid }}".deb \
            artifacts/linux-packages/*-"${{ matrix.rid }}".rpm \
            artifacts/linux-packages/*-"${{ matrix.rid }}".AppImage

      - name: Rebuild and compare x64 packages
        if: matrix.rid == 'linux-x64'
        env:
          APPIMAGE_RUNTIME_FILE: ${{ github.workspace }}/artifacts/tools/runtime-${{ matrix.appimage_arch }}
          LINUX_PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}
          SOURCE_DATE_EPOCH: "1704067200"
        run: |
          bash scripts/Build-LinuxPackage.sh \
            "${{ matrix.rid }}" "${{ needs.release-metadata.outputs.release_version }}" \
            artifacts/linux-packages-rebuilt all
          cmp artifacts/linux-packages/*-"${{ matrix.rid }}".sha256 \
            artifacts/linux-packages-rebuilt/*-"${{ matrix.rid }}".sha256

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DevolutionsTerminal-${{ matrix.rid }}-packages
          path: artifacts/linux-packages
          if-no-files-found: error

  linux-arm64-hardware:
    name: Linux ARM64 native runtime (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    needs: linux-packages
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          $machine = uname -m
          if ($machine -notin @("aarch64", "arm64")) {
            Write-Error "::error::linux-arm64-hardware requires native ARM64; uname -m returned '$machine'. QEMU is not an accepted fallback."
            exit 78
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream cpio desktop-file-utils rpm squashfs-tools

      - name: Download ARM64 packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DevolutionsTerminal-linux-arm64-packages
          path: artifacts/linux-arm64-packages

      - name: Run native non-UI ARM64 gates
        shell: bash
        run: bash scripts/Test-LinuxArm64Runtime.sh artifacts/linux-arm64-packages

  msix:
    name: Unsigned MSIX packages
    needs:
      - native-aot
      - release-metadata
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up WinApp CLI
        uses: microsoft/setup-WinAppCli@cc8ea9a08b3ee3db43d5aa6bddda4a0e87d800f7 # v0.1
        with:
          version: v0.6.0

      - name: Download x64 publish
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DevolutionsTerminal-win-x64
          path: artifacts/msix/layout/win-x64

      - name: Download arm64 publish
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DevolutionsTerminal-win-arm64
          path: artifacts/msix/layout/win-arm64

      - name: Build unsigned MSIX packages
        shell: pwsh
        run: >
          ./src/Devolutions.Terminal.Package/Scripts/Build-Packages.ps1
          -SkipPublish
          -OutputDirectory ./artifacts/msix
          -Version "${{ needs.release-metadata.outputs.msix_version }}"

      - name: Validate package structure
        shell: pwsh
        run: >
          ./src/Devolutions.Terminal.Package/Scripts/Test-Packages.ps1
          -PackagePath (Get-ChildItem ./artifacts/msix/packages -File |
          Where-Object Extension -eq ".msix" |
          ForEach-Object FullName)

      - name: Upload unsigned MSIX artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DevolutionsTerminal-MSIX-unsigned
          path: artifacts/msix/packages
          if-no-files-found: error

  msi:
    name: MSI packages
    needs:
      - native-aot
      - release-metadata
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download x64 publish
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DevolutionsTerminal-win-x64
          path: artifacts/msi/layout/win-x64

      - name: Download arm64 publish
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DevolutionsTerminal-win-arm64
          path: artifacts/msi/layout/win-arm64

      - name: Build MSI packages
        shell: pwsh
        run: >
          ./src/Devolutions.Terminal.Package/Scripts/Build-Msi.ps1
          -SkipPublish
          -OutputDirectory ./artifacts/msi
          -Version "${{ needs.release-metadata.outputs.msix_version }}"

      - name: Upload unsigned MSI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DevolutionsTerminal-MSI-unsigned
          path: artifacts/msi/packages
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build
      - native-aot
      - linux-managed
      - macos-managed
      - macos-native-aot
      - linux-packages
      - linux-arm64-hardware
      - msix
      - msi
      - release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: ${{ needs.release-metadata.outputs.publish_environment }}
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
      MSIX_VERSION: ${{ needs.release-metadata.outputs.msix_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Windows unsigned MSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DevolutionsTerminal-MSIX-unsigned
          path: artifacts/msix-packages

      - name: Download Windows unsigned MSI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DevolutionsTerminal-MSI-unsigned
          path: artifacts/msi-packages

      - name: Download Linux x64 packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DevolutionsTerminal-linux-x64-packages
          path: artifacts/linux-x64

      - name: Download Linux arm64 packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DevolutionsTerminal-linux-arm64-packages
          path: artifacts/linux-arm64

      - name: Download macOS package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DevolutionsTerminal-osx-arm64-packages
          path: artifacts/macos-packages

      - name: Resolve signing mode
        id: signing-mode
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
        run: |
          $dryRun = [System.Boolean]::Parse('${{ needs.release-metadata.outputs.dry_run }}')
          $signDryRun = [System.Boolean]::Parse('${{ needs.release-metadata.outputs.sign_dry_run }}')
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "TRUSTED_SIGNING_ENDPOINT",
            "TRUSTED_SIGNING_ACCOUNT_NAME",
            "TRUSTED_SIGNING_PROFILE_NAME"
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })

          if ($dryRun -and -not $signDryRun) {
            "should_sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Dry run will not sign Windows packages."
            exit 0
          }

          if ($missing.Count -gt 0) {
            if ($dryRun) {
              "should_sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "::notice::Skipping dry-run signing because these secrets are unavailable: $($missing -join ', ')"
              exit 0
            }

            throw "Missing Azure Artifact Signing secrets: $($missing -join ', ')"
          }

          "should_sign=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Linux psign-tool
        if: steps.signing-mode.outputs.should_sign == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "psign-tool"
          $extractRoot = Join-Path $toolRoot "expanded"
          if (Test-Path -LiteralPath $toolRoot) {
            Remove-Item -LiteralPath $toolRoot -Recurse -Force
          }

          New-Item -Path $extractRoot -ItemType Directory -Force | Out-Null
          gh release download --repo Devolutions/psign --pattern "psign-tool-linux-x64.zip" --dir $toolRoot --clobber

          $toolArchivePath = Join-Path $toolRoot "psign-tool-linux-x64.zip"
          if (-not (Test-Path -LiteralPath $toolArchivePath -PathType Leaf)) {
            throw "psign-tool archive was not found at $toolArchivePath"
          }

          Expand-Archive -Path $toolArchivePath -DestinationPath $extractRoot -Force
          $toolPath = Join-Path $extractRoot "psign-tool"
          if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
            throw "psign-tool executable was not found at $toolPath"
          }

          chmod +x $toolPath
          $extractRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $toolPath --version

      - name: Azure login for Trusted Signing
        if: steps.signing-mode.outputs.should_sign == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows packages with Azure Artifact Signing
        if: steps.signing-mode.outputs.should_sign == 'true'
        shell: pwsh
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
          TRUSTED_SIGNING_TIMESTAMP_SERVER: ${{ vars.TRUSTED_SIGNING_TIMESTAMP_SERVER }}
        run: |
          $timestampServer = $env:TRUSTED_SIGNING_TIMESTAMP_SERVER
          if ([string]::IsNullOrWhiteSpace($timestampServer)) {
            $timestampServer = "http://timestamp.acs.microsoft.com/"
          }

          $accessToken = az account get-access-token `
            --scope https://codesigning.azure.net/.default `
            --query accessToken `
            --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($accessToken)) {
            throw "Failed to acquire an Azure Trusted Signing access token."
          }

          ./src/Devolutions.Terminal.Package/Scripts/Sign-Packages.ps1 `
            -PackageDirectory ./artifacts/msix-packages `
            -Version $env:MSIX_VERSION `
            -ArtifactSigningEndpoint $env:TRUSTED_SIGNING_ENDPOINT `
            -ArtifactSigningAccountName $env:TRUSTED_SIGNING_ACCOUNT_NAME `
            -ArtifactSigningProfileName $env:TRUSTED_SIGNING_PROFILE_NAME `
            -ArtifactSigningAccessToken $accessToken `
            -TimestampServer $timestampServer

          ./src/Devolutions.Terminal.Package/Scripts/Sign-Packages.ps1 `
            -PackageDirectory ./artifacts/msi-packages `
            -Version $env:MSIX_VERSION `
            -ArtifactSigningEndpoint $env:TRUSTED_SIGNING_ENDPOINT `
            -ArtifactSigningAccountName $env:TRUSTED_SIGNING_ACCOUNT_NAME `
            -ArtifactSigningProfileName $env:TRUSTED_SIGNING_PROFILE_NAME `
            -ArtifactSigningAccessToken $accessToken `
            -TimestampServer $timestampServer

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $artifactDirectories = @(
            "artifacts/msix-packages",
            "artifacts/msi-packages",
            "artifacts/linux-x64",
            "artifacts/linux-arm64",
            "artifacts/macos-packages"
          )
          foreach ($directory in $artifactDirectories) {
            Get-ChildItem -LiteralPath $directory -File | Copy-Item -Destination artifacts/release -Force
          }
          Get-ChildItem -LiteralPath artifacts/release -File | Select-Object -ExpandProperty Name

      - name: Upload dry-run release assets
        if: needs.release-metadata.outputs.dry_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DevolutionsTerminal-${{ env.RELEASE_TAG }}-dry-run
          path: artifacts/release
          if-no-files-found: error

      - name: Publish release to GitHub Releases
        if: needs.release-metadata.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --title "Devolutions Terminal $($env:RELEASE_TAG.TrimStart('v'))" `
              --generate-notes `
              --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub release $env:RELEASE_TAG."
            }
          }
          $assets = Get-ChildItem -LiteralPath artifacts/release -File | ForEach-Object FullName
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets."
          }
