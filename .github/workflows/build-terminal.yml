      - name: Smoke test NuGet package import
        shell: pwsh
        run: >
          ./src/Devolutions.Terminal.Package/Scripts/Test-NuGetDistribution.ps1
          -PackageDirectory ./artifacts/nuget/packages
          -Version "${{ needs.release-metadata.outputs.release_version }}"

      - name: Upload NuGet distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: DevolutionsTerminal-NuGet
          path: artifacts/nuget/packages/*.nupkg
          if-no-files-found: error

  msi:
    name: MSI packages
    needs:
      - native-aot
      - release-metadata
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    environment:
      # Ordinary (non-release) builds are bound to the low-stakes dry-run environment so they never
      # wait on approval/protection rules meant for real signing releases; only an actual release
      # trigger (workflow_dispatch or a tag push) is bound to the real signing environment.
      name: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && needs.release-metadata.outputs.publish_environment || 'publish-dry-run' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x64 publish
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-win-x64
          path: artifacts/msi/layout/win-x64

      - name: Download arm64 publish
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-win-arm64
          path: artifacts/msi/layout/win-arm64

      - name: Set up WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.1
        with:
          version: v0.6.0

      - name: Resolve binary signing mode
        id: signing-mode
        shell: pwsh
        env:
          IS_RELEASE_EVENT: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
        run: |
          # Ordinary (non-release) CI runs never attempt binary signing: they are not gated on
          # signing secrets being configured, so they must not fail when those secrets are absent.
          if ($env:IS_RELEASE_EVENT -ne "true") {
            "should_sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Not a release build; skipping binary signing."
            exit 0
          }

          $dryRun = [System.Boolean]::Parse('${{ needs.release-metadata.outputs.dry_run }}')
          $signDryRun = [System.Boolean]::Parse('${{ needs.release-metadata.outputs.sign_dry_run }}')
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "TRUSTED_SIGNING_ENDPOINT",
            "TRUSTED_SIGNING_ACCOUNT_NAME",
            "TRUSTED_SIGNING_PROFILE_NAME"
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })

          if ($dryRun -and -not $signDryRun) {
            "should_sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Dry run will not sign the application binaries bundled in the MSI."
            exit 0
          }

          if ($missing.Count -gt 0) {
            if ($dryRun) {
              "should_sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "::notice::Skipping dry-run binary signing because these secrets are unavailable: $($missing -join ', ')"
              exit 0
            }

            throw "Missing Azure Artifact Signing secrets: $($missing -join ', ')"
          }

          "should_sign=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Windows psign-tool
        if: steps.signing-mode.outputs.should_sign == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "psign-tool"
          if (Test-Path -LiteralPath $toolRoot) {
            Remove-Item -LiteralPath $toolRoot -Recurse -Force
          }

          New-Item -Path $toolRoot -ItemType Directory -Force | Out-Null
          gh release download --repo Devolutions/psign --pattern "psign-tool-windows-x64.zip" --dir $toolRoot --clobber

          $toolArchivePath = Join-Path $toolRoot "psign-tool-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $toolArchivePath -PathType Leaf)) {
            throw "psign-tool archive was not found at $toolArchivePath"
          }

          Expand-Archive -Path $toolArchivePath -DestinationPath $toolRoot -Force
          $toolPath = Join-Path $toolRoot "psign-tool.exe"
          if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
            throw "psign-tool executable was not found at $toolPath"
          }

          $toolRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $toolPath --version

      - name: Azure login for Trusted Signing
        if: steps.signing-mode.outputs.should_sign == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign application binaries bundled in the MSI
        if: steps.signing-mode.outputs.should_sign == 'true'
        shell: pwsh
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
          TRUSTED_SIGNING_TIMESTAMP_SERVER: ${{ vars.TRUSTED_SIGNING_TIMESTAMP_SERVER }}
        run: |
          $timestampServer = $env:TRUSTED_SIGNING_TIMESTAMP_SERVER
          if ([string]::IsNullOrWhiteSpace($timestampServer)) {
            $timestampServer = "http://timestamp.acs.microsoft.com/"
          }

          $accessToken = az account get-access-token `
            --scope https://codesigning.azure.net/.default `
            --query accessToken `
            --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($accessToken)) {
            throw "Failed to acquire an Azure Trusted Signing access token."
          }

          ./src/Devolutions.Terminal.Package/Scripts/Sign-Packages.ps1 `
            -BinaryDirectory artifacts/msi/layout/win-x64, artifacts/msi/layout/win-arm64 `
            -Version "${{ needs.release-metadata.outputs.msix_version }}" `
            -ArtifactSigningEndpoint $env:TRUSTED_SIGNING_ENDPOINT `
            -ArtifactSigningAccountName $env:TRUSTED_SIGNING_ACCOUNT_NAME `
            -ArtifactSigningProfileName $env:TRUSTED_SIGNING_PROFILE_NAME `
            -ArtifactSigningAccessToken $accessToken `
            -TimestampServer $timestampServer

      - name: Build MSI packages
        shell: pwsh
        run: >
          ./src/Devolutions.Terminal.Package/Scripts/Build-Msi.ps1
          -SkipPublish
          -OutputDirectory ./artifacts/msi
          -Version "${{ needs.release-metadata.outputs.msix_version }}"

      - name: Validate MSI package structure
        shell: pwsh
        env:
          SHOULD_SIGN: ${{ steps.signing-mode.outputs.should_sign }}
        run: |
          $packagePaths = Get-ChildItem ./artifacts/msi/packages -File |
            Where-Object Extension -eq ".msi" |
            ForEach-Object FullName

          $arguments = @{
            PackagePath = $packagePaths
          }
          if ($env:SHOULD_SIGN -eq "true") {
            $arguments["RequireBinarySignature"] = $true
          }

          ./src/Devolutions.Terminal.Package/Scripts/Test-Packages.ps1 @arguments

      - name: Upload unsigned MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevolutionsTerminal-MSI-unsigned
          path: artifacts/msi/packages
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build
      - native-aot
      - linux-managed
      - macos-managed
      - macos-native-aot
      - macos-sign
      - linux-packages
      - linux-arm64-hardware
      - msix
      - msi
      - nuget
      - release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: ${{ needs.release-metadata.outputs.publish_environment }}
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
      MSIX_VERSION: ${{ needs.release-metadata.outputs.msix_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows unsigned MSIX
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-MSIX-unsigned
          path: artifacts/msix-packages

      - name: Download Windows unsigned MSI
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-MSI-unsigned
          path: artifacts/msi-packages

      - name: Download Linux x64 packages
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-linux-x64-packages
          path: artifacts/linux-x64

      - name: Download Linux arm64 packages
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-linux-arm64-packages
          path: artifacts/linux-arm64

      - name: Download macOS arm64 package artifacts
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-osx-arm64-signed-packages
          path: artifacts/macos-packages

      - name: Download macOS x64 package artifacts
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-osx-x64-signed-packages
          path: artifacts/macos-packages

      - name: Download NuGet distribution packages
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-NuGet
          path: artifacts/nuget

      - name: NuGet login (OIDC)
        if: needs.release-metadata.outputs.dry_run != 'true' && needs.release-metadata.outputs.publish_nuget == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_BOT_USERNAME }}

      - name: Publish NuGet distribution packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dryRun = [System.Boolean]::Parse('${{ needs.release-metadata.outputs.dry_run }}')
          $publishNuget = [System.Boolean]::Parse('${{ needs.release-metadata.outputs.publish_nuget }}')
          $packages = @(Get-ChildItem -LiteralPath artifacts/nuget -Filter "*.nupkg" -File | Sort-Object Name)
          if ($packages.Count -ne 7) {
            throw "Expected seven NuGet packages, found $($packages.Count)."
          }

          $pointerPackageName = 'Devolutions.Terminal.App.${{ needs.release-metadata.outputs.release_version }}.nupkg'
          $pointerPackages = @($packages | Where-Object Name -eq $pointerPackageName)
          if ($pointerPackages.Count -ne 1) {
            throw "Expected one NuGet pointer package named '$pointerPackageName', found $($pointerPackages.Count)."
          }

          $runtimePackages = @($packages | Where-Object Name -ne $pointerPackageName)
          $orderedPackages = @($runtimePackages) + @($pointerPackages[0])
          if ($dryRun) {
            Write-Host "Dry run: skipping NuGet.org publication of $($orderedPackages.Count) packages."
            exit 0
          }

          if (-not $publishNuget) {
            Write-Host "NuGet.org publication is disabled; the packages will remain available as GitHub release assets."
            exit 0
          }

          $nugetApiKey = '${{ steps.nuget-login.outputs.NUGET_API_KEY }}'
          if ([string]::IsNullOrWhiteSpace($nugetApiKey)) {
            throw "NuGet/login did not provide a NuGet API key."
          }

          foreach ($package in $orderedPackages) {
            & dotnet nuget push $package.FullName `
              --api-key $nugetApiKey `
              --source $env:NUGET_PACKAGE_SOURCE `
              --skip-duplicate `
              --no-symbols
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet nuget push failed for '$($package.FullName)' with exit code $LASTEXITCODE."
            }
          }

      - name: Resolve signing mode
        id: signing-mode
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
        run: |
          $dryRun = [System.Boolean]::Parse('${{ needs.release-metadata.outputs.dry_run }}')
          $signDryRun = [System.Boolean]::Parse('${{ needs.release-metadata.outputs.sign_dry_run }}')
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "TRUSTED_SIGNING_ENDPOINT",
            "TRUSTED_SIGNING_ACCOUNT_NAME",
            "TRUSTED_SIGNING_PROFILE_NAME"
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })

          if ($dryRun -and -not $signDryRun) {
            "should_sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Dry run will not sign Windows packages."
            exit 0
          }

          if ($missing.Count -gt 0) {
            if ($dryRun) {
              "should_sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "::notice::Skipping dry-run signing because these secrets are unavailable: $($missing -join ', ')"
              exit 0
            }

            throw "Missing Azure Artifact Signing secrets: $($missing -join ', ')"
          }

          "should_sign=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Linux psign-tool
        if: steps.signing-mode.outputs.should_sign == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "psign-tool"
          $extractRoot = Join-Path $toolRoot "expanded"
          if (Test-Path -LiteralPath $toolRoot) {
            Remove-Item -LiteralPath $toolRoot -Recurse -Force
          }

          New-Item -Path $extractRoot -ItemType Directory -Force | Out-Null
          gh release download --repo Devolutions/psign --pattern "psign-tool-linux-x64.zip" --dir $toolRoot --clobber

          $toolArchivePath = Join-Path $toolRoot "psign-tool-linux-x64.zip"
          if (-not (Test-Path -LiteralPath $toolArchivePath -PathType Leaf)) {
            throw "psign-tool archive was not found at $toolArchivePath"
          }

          Expand-Archive -Path $toolArchivePath -DestinationPath $extractRoot -Force
          $toolPath = Join-Path $extractRoot "psign-tool"
          if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
            throw "psign-tool executable was not found at $toolPath"
          }

          chmod +x $toolPath
          $extractRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $toolPath --version

      - name: Azure login for Trusted Signing
        if: steps.signing-mode.outputs.should_sign == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows packages with Azure Artifact Signing
        if: steps.signing-mode.outputs.should_sign == 'true'
        shell: pwsh
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
          TRUSTED_SIGNING_TIMESTAMP_SERVER: ${{ vars.TRUSTED_SIGNING_TIMESTAMP_SERVER }}
        run: |
          $timestampServer = $env:TRUSTED_SIGNING_TIMESTAMP_SERVER
          if ([string]::IsNullOrWhiteSpace($timestampServer)) {
            $timestampServer = "http://timestamp.acs.microsoft.com/"
          }

          $accessToken = az account get-access-token `
            --scope https://codesigning.azure.net/.default `
            --query accessToken `
            --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($accessToken)) {
            throw "Failed to acquire an Azure Trusted Signing access token."
          }

          ./src/Devolutions.Terminal.Package/Scripts/Sign-Packages.ps1 `
            -PackageDirectory ./artifacts/msix-packages `
            -Version $env:MSIX_VERSION `
            -ArtifactSigningEndpoint $env:TRUSTED_SIGNING_ENDPOINT `
            -ArtifactSigningAccountName $env:TRUSTED_SIGNING_ACCOUNT_NAME `
            -ArtifactSigningProfileName $env:TRUSTED_SIGNING_PROFILE_NAME `
            -ArtifactSigningAccessToken $accessToken `
            -TimestampServer $timestampServer

          ./src/Devolutions.Terminal.Package/Scripts/Sign-Packages.ps1 `
            -PackageDirectory ./artifacts/msi-packages `
            -Version $env:MSIX_VERSION `
            -ArtifactSigningEndpoint $env:TRUSTED_SIGNING_ENDPOINT `
            -ArtifactSigningAccountName $env:TRUSTED_SIGNING_ACCOUNT_NAME `
            -ArtifactSigningProfileName $env:TRUSTED_SIGNING_PROFILE_NAME `
            -ArtifactSigningAccessToken $accessToken `
            -TimestampServer $timestampServer

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $artifactDirectories = @(
            "artifacts/msix-packages",
            "artifacts/msi-packages",
            "artifacts/linux-x64",
            "artifacts/linux-arm64",
            "artifacts/macos-packages",
            "artifacts/nuget"
          )
          foreach ($directory in $artifactDirectories) {
            Get-ChildItem -LiteralPath $directory -File | Copy-Item -Destination artifacts/release -Force
          }
          Get-ChildItem -LiteralPath artifacts/release -File | Select-Object -ExpandProperty Name

      - name: Upload dry-run release assets
        if: needs.release-metadata.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DevolutionsTerminal-${{ env.RELEASE_TAG }}-dry-run
          path: artifacts/release
          if-no-files-found: error

      - name: Publish release to GitHub Releases
        if: needs.release-metadata.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --title "Devolutions Terminal $($env:RELEASE_TAG.TrimStart('v'))" `
              --generate-notes `
              --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub release $env:RELEASE_TAG."
            }
          }
          $assets = Get-ChildItem -LiteralPath artifacts/release -File | ForEach-Object FullName
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets."
          }
