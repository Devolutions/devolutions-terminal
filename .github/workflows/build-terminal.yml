name: Build Terminal

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - ".github/workflows/build-ghostty.yml"
  pull_request:
    paths-ignore:
      - ".github/workflows/build-ghostty.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to build/publish (X.Y.Z, for example 2026.3.0).
        required: true
        type: string
      dry_run:
        description: Dry run.
        required: false
        default: false
        type: boolean
      publish_nuget:
        description: Publish Devolutions.Terminal.App to NuGet.org (requires trusted publishing).
        required: false
        default: false
        type: boolean
      sign_dry_run:
        description: Sign Windows and macOS packages during a dry run when signing credentials are available.
        required: false
        default: false
        type: boolean
      github-env:
        description: GitHub Environment for code-signing secrets.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - test
          - prod

permissions:
  contents: read

env:
  NUGET_PACKAGE_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      msix_version: ${{ steps.resolve.outputs.msix_version }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      publish_nuget: ${{ steps.resolve.outputs.publish_nuget }}
      sign_dry_run: ${{ steps.resolve.outputs.sign_dry_run }}
      publish_environment: ${{ steps.resolve.outputs.publish_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag, versions, and signing environment
        id: resolve
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_NUGET: ${{ inputs.publish_nuget }}
          SIGN_DRY_RUN: ${{ inputs.sign_dry_run }}
          REQUESTED_ENVIRONMENT: ${{ inputs['github-env'] }}
        run: |
          $dryRun = if ([string]::IsNullOrWhiteSpace($env:DRY_RUN)) { "false" } else { $env:DRY_RUN.ToLowerInvariant() }
          if ($dryRun -notin @("true", "false")) {
            throw "dry_run must be true or false."
          }

          $publishNuget = if ($env:GITHUB_REF_TYPE -eq "tag") { "true" } elseif ([string]::IsNullOrWhiteSpace($env:PUBLISH_NUGET)) { "false" } else { $env:PUBLISH_NUGET.ToLowerInvariant() }
          if ($publishNuget -notin @("true", "false")) {
            throw "publish_nuget must be true or false."
          }

          $signDryRun = if ([string]::IsNullOrWhiteSpace($env:SIGN_DRY_RUN)) { "false" } else { $env:SIGN_DRY_RUN.ToLowerInvariant() }
          if ($signDryRun -notin @("true", "false")) {
            throw "sign_dry_run must be true or false."
          }

          if ($dryRun -eq "true" -and $signDryRun -ne "true") {
            $publishEnvironment = "publish-dry-run"
          }
          else {
            $requestedEnvironment = if ([string]::IsNullOrWhiteSpace($env:REQUESTED_ENVIRONMENT)) { "auto" } else { $env:REQUESTED_ENVIRONMENT.ToLowerInvariant() }
            $publishEnvironment = switch ($requestedEnvironment) {
              "auto" { if ($env:GITHUB_REF_TYPE -eq "tag" -or $env:GITHUB_REF_NAME -eq "master") { "publish-prod" } else { "publish-test" } }
              "test" { "publish-test" }
              "prod" { "publish-prod" }
              default { throw "Unsupported github-env value: $requestedEnvironment. Expected auto, test, or prod." }
            }
          }

          $requestedVersion = if ($null -eq $env:REQUESTED_VERSION) { "" } else { $env:REQUESTED_VERSION.Trim() }
          $tag = $null
          if (-not [string]::IsNullOrWhiteSpace($requestedVersion)) {
            if ($requestedVersion -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
              throw "Release version must use X.Y.Z; received '$($env:REQUESTED_VERSION)'."
            }
            $releaseVersion = $requestedVersion
            $tag = "v$releaseVersion"
          }
          elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              throw "Release tag must be vYYYY.MAJOR.PATCH; received '$tag'."
            }
            $releaseVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          }
          else {
            [xml]$props = Get-Content -LiteralPath "Directory.Build.props"
            $releaseVersion = $props.Project.PropertyGroup.VersionPrefix
            if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "Directory.Build.props must contain a three-component numeric VersionPrefix."
            }
            $tag = "v$releaseVersion.$env:GITHUB_RUN_NUMBER"
          }

          $msixVersion = "$releaseVersion.0"
          @(
            "release_tag=$tag"
            "release_version=$releaseVersion"
            "msix_version=$msixVersion"
            "dry_run=$dryRun"
            "publish_nuget=$publishNuget"
            "sign_dry_run=$signDryRun"
            "publish_environment=$publishEnvironment"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build:
    name: Build and test
    runs-on: windows-latest
    needs: release-metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            artifacts/tools
            artifacts/ghostty-src
            native/ghostty/*/*
            native/linux-pty/*/dt-pty-host
            native/noto-emoji/NotoColorEmoji.ttf
          # Never restore native sources or reuse binaries built from different inputs.
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/*.ps1', 'native/ghostty/ghostty-upstream.json', 'native/linux-pty/dt-pty-host.c', 'native/noto-emoji/noto-emoji.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Devolutions.Terminal.slnx -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Build
        run: dotnet build Devolutions.Terminal.slnx -c Release --no-restore -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Test
        run: dotnet test Devolutions.Terminal.slnx -c Release --no-build -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

  nuget-pack:
    name: Pack Devolutions.Terminal.Control NuGet package
    runs-on: windows-latest
    needs:
      - release-metadata
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            native/noto-emoji/NotoColorEmoji.ttf
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/*.ps1', 'native/ghostty/ghostty-upstream.json', 'native/linux-pty/dt-pty-host.c', 'native/noto-emoji/noto-emoji.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack Devolutions.Terminal.Control
        run: >-
          dotnet pack src/Devolutions.Terminal.Control/Devolutions.Terminal.Control.csproj
          -c Release
          -o artifacts/nuget
          -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Smoke-test package via samples/Devolutions.Terminal.Control.Sample
        run: dotnet build samples/Devolutions.Terminal.Control.Sample -c Release

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevolutionsTerminal-nuget-packages
          path: artifacts/nuget
          if-no-files-found: error

  nuget-publish:
    name: Publish Devolutions.Terminal.Control to nuget.org
    if: ${{ needs.release-metadata.outputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - release-metadata
      - nuget-pack
    runs-on: ubuntu-latest
    environment:
      name: nuget.org
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet package artifacts
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-nuget-packages
          path: artifacts/nuget

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "Missing NUGET_API_KEY secret."
          }

          $packages = Get-ChildItem -LiteralPath artifacts/nuget -Filter "*.nupkg" -File
          if ($packages.Count -eq 0) {
            throw "No .nupkg files found to publish."
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --source https://api.nuget.org/v3/index.json `
              --api-key $env:NUGET_API_KEY `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to push $($package.Name) to nuget.org."
            }
          }

  native-aot:
    name: NativeAOT ${{ matrix.rid }}
    runs-on: windows-latest
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            artifacts/tools
            artifacts/ghostty-src
            native/ghostty/*/*
            native/linux-pty/*/dt-pty-host
            native/noto-emoji/NotoColorEmoji.ttf
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rid }}-${{ hashFiles('native/**/*.ps1', 'native/ghostty/ghostty-upstream.json', 'native/linux-pty/dt-pty-host.c', 'native/noto-emoji/noto-emoji.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Devolutions.Terminal/Devolutions.Terminal.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}
          -o artifacts/${{ matrix.rid }}

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: DevolutionsTerminal-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error

  linux-managed:
    name: Linux managed and metadata tests
    runs-on: ubuntu-24.04
    needs: release-metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            artifacts/tools
            artifacts/ghostty-src
            native/ghostty/*/*
            native/linux-pty/*/dt-pty-host
            native/noto-emoji/NotoColorEmoji.ttf
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/*.ps1', 'native/ghostty/ghostty-upstream.json', 'native/linux-pty/dt-pty-host.c', 'native/noto-emoji/noto-emoji.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Devolutions.Terminal.slnx -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Run managed tests
        run: dotnet test Devolutions.Terminal.slnx -c Release --no-restore -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Validate Linux scripts and metadata
        run: bash scripts/Test-LinuxPackagingMetadata.sh

  macos-managed:
    name: macOS managed and metadata tests
    runs-on: macos-14
    needs: release-metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            artifacts/tools
            artifacts/ghostty-src
            native/ghostty/*/*
            native/linux-pty/*/dt-pty-host
            native/noto-emoji/NotoColorEmoji.ttf
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/*.ps1', 'native/ghostty/ghostty-upstream.json', 'native/linux-pty/dt-pty-host.c', 'native/noto-emoji/noto-emoji.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Devolutions.Terminal.slnx -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Run managed tests
        run: dotnet test Devolutions.Terminal.slnx -c Release --no-restore -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}

      - name: Validate macOS scripts and metadata
        run: pwsh -NoLogo -NoProfile -File scripts/Test-MacOsPackagingMetadata.ps1

      - name: Test macOS code-signing topology
        run: pwsh -NoLogo -NoProfile -File scripts/Test-MacOsCodeSigning.ps1

  macos-native-aot:
    name: macOS NativeAOT ${{ matrix.rid }}
    runs-on: macos-14
    needs:
      - macos-managed
      - release-metadata
    strategy:
      fail-fast: false
      matrix:
        rid:
          - osx-arm64
          - osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: |
            artifacts/tools
            artifacts/ghostty-src
            native/ghostty/*/*
            native/linux-pty/*/dt-pty-host
            native/noto-emoji/NotoColorEmoji.ttf
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/*.ps1', 'native/ghostty/ghostty-upstream.json', 'native/linux-pty/dt-pty-host.c', 'native/noto-emoji/noto-emoji.json') }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NativeAOT publish
        run: >
          dotnet publish src/Devolutions.Terminal/Devolutions.Terminal.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}
          -p:DebugSymbols=false
          -p:DebugType=None
          -p:NativeDebugSymbols=false
          -o artifacts/publish/${{ matrix.rid }}

      - name: Upload macOS NativeAOT publish
        uses: actions/upload-artifact@v4
        with:
          name: DevolutionsTerminal-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
          if-no-files-found: error

      - name: Build app bundle and zip
        env:
          MACOS_PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}
          SOURCE_DATE_EPOCH: "1704067200"
        run: >
          pwsh -NoLogo -NoProfile -File scripts/Build-MacOsPackage.ps1 ${{ matrix.rid }}
          "${{ needs.release-metadata.outputs.release_version }}"
          artifacts/macos-packages

      - name: Validate package without launching UI
        run: pwsh -NoLogo -NoProfile -File scripts/Test-MacOsPackage.ps1 ${{ matrix.rid }} artifacts/macos-packages/*.zip

      - name: Run native non-UI gates
        # NativeAOT osx-x64 binaries are cross-compiled on the arm64 runner and
        # cannot be executed here (no Rosetta on Actions macOS images); only the
        # host's own architecture gets the runtime smoke/unit test gates.
        if: matrix.rid == 'osx-arm64'
        run: pwsh -NoLogo -NoProfile -File scripts/Test-MacOsRuntime.ps1 artifacts/macos-packages

      - name: Upload macOS package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevolutionsTerminal-${{ matrix.rid }}-packages
          path: artifacts/macos-packages
          if-no-files-found: error

  macos-sign:
    name: macOS sign and notarize ${{ matrix.rid }}
    runs-on: macos-14
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    needs:
      - macos-native-aot
      - release-metadata
    environment:
      # Use the same release environment as the downstream publish jobs so macOS signing
      # secrets are available for workflow_dispatch and tag releases.
      name: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && needs.release-metadata.outputs.publish_environment || 'publish-dry-run' }}
    strategy:
      fail-fast: false
      matrix:
        rid:
          - osx-arm64
          - osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unsigned macOS package
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-${{ matrix.rid }}-packages
          path: artifacts/macos-packages

      - name: Resolve signing mode
        id: signing-mode
        shell: pwsh
        env:
          APPLE_APP_DEV_ID_APP_CERTIFICATE: ${{ secrets.APPLE_APP_DEV_ID_APP_CERTIFICATE }}
          APPLE_APP_DEV_ID_APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APP_DEV_ID_APP_CERTIFICATE_PASSWORD }}
          APPLE_BOT_PASSWORD: ${{ secrets.APPLE_BOT_PASSWORD }}
        run: |
          $dryRun = '${{ needs.release-metadata.outputs.dry_run }}'
          $signDryRun = '${{ needs.release-metadata.outputs.sign_dry_run }}'
          $required = @(
            'APPLE_APP_DEV_ID_APP_CERTIFICATE',
            'APPLE_APP_DEV_ID_APP_CERTIFICATE_PASSWORD',
            'APPLE_BOT_PASSWORD'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrEmpty([System.Environment]::GetEnvironmentVariable($_)) })

          if ($dryRun -eq 'true' -and $signDryRun -ne 'true') {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'should_sign=false'
            Write-Host 'Dry run will not sign or notarize macOS packages.'
            exit 0
          }

          if ($missing.Count -gt 0) {
            throw "Missing Apple signing/notarization secrets: $($missing -join ', ')"
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'should_sign=true'

      - name: Import Developer ID certificate
        if: steps.signing-mode.outputs.should_sign == 'true'
        id: import_certificate
        shell: pwsh
        env:
          APPLE_APP_DEV_ID_APP_CERTIFICATE: ${{ secrets.APPLE_APP_DEV_ID_APP_CERTIFICATE }}
          APPLE_APP_DEV_ID_APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APP_DEV_ID_APP_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $keychain = Join-Path $env:RUNNER_TEMP 'macos-signing.keychain-db'
          $keychainPassword = (& uuidgen)
          $certificatePath = Join-Path $env:RUNNER_TEMP 'apple-certificate.p12'

          try {
            [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:APPLE_APP_DEV_ID_APP_CERTIFICATE))

            & security create-keychain -p $keychainPassword $keychain
            & security set-keychain-settings -lut 21600 $keychain
            & security unlock-keychain -p $keychainPassword $keychain
            & security import $certificatePath -k $keychain -P $env:APPLE_APP_DEV_ID_APP_CERTIFICATE_PASSWORD `
              -T /usr/bin/codesign -T /usr/bin/security
            & security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $keychainPassword $keychain
            & security list-keychains -d user -s $keychain login.keychain-db

            $identities = (& security find-identity -v -p codesigning $keychain) -join "`n"
            Write-Host $identities
            $identityMatches = [regex]::Matches(
              $identities,
              '(?m)^\s*\d+\)\s+([0-9A-Fa-f]{40})\s+"Developer ID Application:'
            )
            if ($identityMatches.Count -ne 1) {
              throw "Expected exactly one Developer ID Application identity, found $($identityMatches.Count)."
            }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT `
              -Value "identity=$($identityMatches[0].Groups[1].Value)"
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Sign, package, and notarize
        if: steps.signing-mode.outputs.should_sign == 'true'
        env:
          APPLE_BOT_PASSWORD: ${{ secrets.APPLE_BOT_PASSWORD }}
          SOURCE_DATE_EPOCH: "1704067200"
        run: >
          pwsh -NoLogo -NoProfile -File scripts/Release-MacOsPackage.ps1 ${{ matrix.rid }}
          "${{ needs.release-metadata.outputs.release_version }}"
          artifacts/macos-packages
          artifacts/macos-signed-packages
          "${{ steps.import_certificate.outputs.identity }}"

      - name: Package without notarization (dry run / forked PR)
        if: steps.signing-mode.outputs.should_sign != 'true'
        env:
          SOURCE_DATE_EPOCH: "1704067200"
        run: >
          pwsh -NoLogo -NoProfile -File scripts/Release-MacOsPackage.ps1 ${{ matrix.rid }}
          "${{ needs.release-metadata.outputs.release_version }}"
          artifacts/macos-packages
          artifacts/macos-signed-packages

      - name: Validate final package
        run: pwsh -NoLogo -NoProfile -File scripts/Test-MacOsPackage.ps1 ${{ matrix.rid }} artifacts/macos-signed-packages/*.zip

      - name: Upload final macOS package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevolutionsTerminal-${{ matrix.rid }}-signed-packages
          path: artifacts/macos-signed-packages
          if-no-files-found: error

      - name: Delete temporary signing keychain
        if: always() && steps.signing-mode.outputs.should_sign == 'true'
        shell: pwsh
        run: |
          $keychain = Join-Path $env:RUNNER_TEMP 'macos-signing.keychain-db'
          if (Test-Path -LiteralPath $keychain) {
            & security delete-keychain $keychain
          }

  linux-packages:
    name: Linux packages ${{ matrix.rid }}
    runs-on: ubuntu-24.04
    needs:
      - linux-managed
      - release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            appimage_arch: x86_64
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - rid: linux-arm64
            appimage_arch: aarch64
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream desktop-file-utils rpm squashfs-tools

      - name: Install ARM64 cross toolchain
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get install --no-install-recommends \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Fetch pinned AppImage runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/tools | Out-Null
          gh release download 20251108 --repo AppImage/type2-runtime `
            --pattern "runtime-${{ matrix.appimage_arch }}" `
            --dir artifacts/tools
          $runtime = "artifacts/tools/runtime-${{ matrix.appimage_arch }}"
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $runtime).Hash.ToLowerInvariant()
          if ($actualHash -ne "${{ matrix.runtime_sha256 }}") {
            throw "Runtime hash mismatch: expected ${{ matrix.runtime_sha256 }}, got $actualHash."
          }

      - name: NativeAOT publish
        shell: pwsh
        run: |
          $publishArgs = @(
            "src/Devolutions.Terminal/Devolutions.Terminal.csproj",
            "-c", "Release",
            "-r", "${{ matrix.rid }}",
            "--self-contained", "true",
            "-p:VersionPrefix=${{ needs.release-metadata.outputs.release_version }}",
            "-p:DebugSymbols=false",
            "-p:DebugType=None",
            "-p:NativeDebugSymbols=false",
            "-o", "artifacts/publish/${{ matrix.rid }}"
          )
          if ("${{ matrix.rid }}" -eq "linux-arm64") {
            $publishArgs += "-p:ObjCopyName=aarch64-linux-gnu-objcopy"
          }
          dotnet publish @publishArgs

      - name: Upload Linux NativeAOT publish
        uses: actions/upload-artifact@v4
        with:
          name: DevolutionsTerminal-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
          if-no-files-found: error

      - name: Build deterministic tar, DEB, RPM, and AppImage
        env:
          APPIMAGE_RUNTIME_FILE: ${{ github.workspace }}/artifacts/tools/runtime-${{ matrix.appimage_arch }}
          LINUX_PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}
          SOURCE_DATE_EPOCH: "1704067200"
        run: |
          bash scripts/Build-LinuxPackage.sh \
            "${{ matrix.rid }}" "${{ needs.release-metadata.outputs.release_version }}" \
            artifacts/linux-packages all

      - name: Validate packages without launching UI
        run: |
          bash scripts/Test-LinuxPackage.sh "${{ matrix.rid }}" \
            artifacts/linux-packages/*-"${{ matrix.rid }}".tar.gz \
            artifacts/linux-packages/*-"${{ matrix.rid }}".deb \
            artifacts/linux-packages/*-"${{ matrix.rid }}".rpm \
            artifacts/linux-packages/*-"${{ matrix.rid }}".AppImage

      - name: Rebuild and compare x64 packages
        if: matrix.rid == 'linux-x64'
        env:
          APPIMAGE_RUNTIME_FILE: ${{ github.workspace }}/artifacts/tools/runtime-${{ matrix.appimage_arch }}
          LINUX_PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}
          SOURCE_DATE_EPOCH: "1704067200"
        run: |
          bash scripts/Build-LinuxPackage.sh \
            "${{ matrix.rid }}" "${{ needs.release-metadata.outputs.release_version }}" \
            artifacts/linux-packages-rebuilt all
          cmp artifacts/linux-packages/*-"${{ matrix.rid }}".sha256 \
            artifacts/linux-packages-rebuilt/*-"${{ matrix.rid }}".sha256

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevolutionsTerminal-${{ matrix.rid }}-packages
          path: artifacts/linux-packages
          if-no-files-found: error

  linux-arm64-hardware:
    name: Linux ARM64 native runtime (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    needs: linux-packages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          $machine = uname -m
          if ($machine -notin @("aarch64", "arm64")) {
            Write-Error "::error::linux-arm64-hardware requires native ARM64; uname -m returned '$machine'. QEMU is not an accepted fallback."
            exit 78
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            appstream cpio desktop-file-utils rpm squashfs-tools

      - name: Download ARM64 packages
        uses: actions/download-artifact@v4
        with:
          name: DevolutionsTerminal-linux-arm64-packages
          path: artifacts/linux-arm64-packages

      - name: Run native non-UI ARM64 gates
        shell: bash
        run: bash scripts/Test-LinuxArm64Runtime.sh artifacts/linux-arm64-packages

  msix:
    name: Unsigned MSIX packages
    needs:
      - native-aot
